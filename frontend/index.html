<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd One Out Online</title>
<style>
:root{color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{--bg:#06161c;--card:#0d2530;--tx:#eef6f8;--mu:#8fb0ba;--ac:#2ee6b6;--ac2:#ffb347;--bd:#1f4a5a;--btn:linear-gradient(180deg,#38f0c0,#14b98e);--btn-tx:#032019;--btn2:linear-gradient(180deg,#ffc468,#f0952a);--btn2-tx:#2b1600;--hero:linear-gradient(135deg,#0b5a56,#0c3550 60%,#12223f);--disp:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--fx:radial-gradient(ellipse at 15% 0,rgba(46,230,182,.16),transparent 45%),radial-gradient(ellipse at 90% 100%,rgba(255,179,71,.09),transparent 40%);margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--fx)}
body[data-mode="mafia"]{--bg:#120a10;--card:#211019;--ac:#d6264a;--ac2:#e0b25a;--bd:#4a2a38;--mu:#b394a0;--btn:linear-gradient(180deg,#e63a5c,#a3162f);--btn-tx:#fff;--btn2:linear-gradient(180deg,#ecc272,#c4923a);--btn2-tx:#2a1b04;--hero:radial-gradient(circle at 88% 8%,rgba(214,38,74,.35),transparent 42%),linear-gradient(135deg,#4d0f22,#1d0c18 65%,#120a10);--disp:Georgia,"Times New Roman",serif;--fx:radial-gradient(ellipse at 50% -10%,rgba(214,38,74,.2),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(224,178,90,.08),transparent 45%)}
body[data-mode="namehunt"]{--bg:#0b0f2e;--card:#161c4d;--ac:#8b6cff;--ac2:#2fe6d6;--bd:#3a4590;--mu:#9aa5e0;--btn:linear-gradient(180deg,#9d83ff,#6544e6);--btn-tx:#fff;--btn2:linear-gradient(180deg,#5cf2e4,#18bfb0);--btn2-tx:#03251f;--hero:radial-gradient(circle at 90% 10%,rgba(47,230,214,.3),transparent 40%),linear-gradient(130deg,#4a2ab5,#232f8f 60%,#0b6b78);--disp:"Arial Rounded MT Bold","Segoe UI Black",system-ui,sans-serif;--fx:radial-gradient(circle,rgba(139,108,255,.16) 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(ellipse at 85% 0,rgba(47,230,214,.14),transparent 45%)}
main{position:relative;z-index:1;display:block;width:100%;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 15px calc(320px + env(safe-area-inset-bottom,0px))}
.game-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px;position:relative;z-index:20}
.game-brand{display:flex;align-items:center;gap:9px;font:900 14px var(--disp);letter-spacing:.03em}
.game-brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--btn);color:var(--btn-tx);font-size:17px;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 35%,transparent)}
.top-actions{display:flex;align-items:center;gap:8px}

.menu-wrap{position:relative}
.host-menu{position:absolute;right:0;top:49px;width:190px;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 18px 42px rgba(0,0,0,.55);z-index:60}
.host-menu button{text-align:left;padding:12px;background:#7d2236;color:#fff;box-shadow:none}
.hero{position:relative;overflow:hidden;text-align:left;padding:22px 19px;border:1px solid var(--bd);border-radius:18px;background:var(--hero);box-shadow:0 14px 36px rgba(0,0,0,.4);margin:6px 0 16px}
.hero:after{content:"✦";position:absolute;right:16px;top:2px;font-size:74px;opacity:.12;transform:rotate(14deg)}

.hero h1{margin:0;font:900 27px/1.1 var(--disp);letter-spacing:-.3px}.hero p{margin:6px 0 0;font-size:13px;color:#dfe8ee;opacity:.92;line-height:1.4}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,0,0,.25)}

body[data-mode="namehunt"] .card{border-color:rgba(139,108,255,.55);border-radius:22px;box-shadow:0 0 0 1px rgba(47,230,214,.1),0 8px 26px rgba(0,0,0,.35)}
.t{display:block;margin-bottom:8px;font:800 12px var(--disp);color:var(--mu);letter-spacing:.07em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.cnt{font-size:30px;font-weight:800}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:13px;padding:14px 16px;width:100%;color:var(--btn-tx);background:var(--btn);box-shadow:0 5px 14px rgba(0,0,0,.35);transition:transform .12s,filter .12s}

button.sm{width:52px;height:52px;padding:0;font-size:26px}

button.pink{background:var(--btn2);color:var(--btn2-tx)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{text-align:left;padding:12px}.g2 small{display:block;font-weight:500;opacity:.75;font-size:11px;margin-top:2px}
input,select{font:inherit;width:100%;padding:12px;margin-bottom:8px;border-radius:12px!important;border:1px solid var(--bd)!important;background:rgba(0,0,0,.32)!important;color:var(--tx)!important}
input::placeholder{color:var(--mu)}
.two{display:flex;gap:8px}.two button{flex:1}.two input{margin:0}
.two.modes{display:grid;grid-template-columns:repeat(3,1fr)}.modes button{padding:12px 4px;font-size:13px;text-align:center}
.big{text-align:center;padding:30px 16px}.big h2{margin:8px 0 6px;font-size:26px}
.av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 10px;box-shadow:0 6px 18px rgba(0,0,0,.35);color:#10151c}
.av.s{width:44px;height:44px;font-size:23px;margin:0;flex:none}
.word{font:900 32px var(--disp);text-align:center;margin:4px 0 2px}.show{text-align:center;color:var(--mu);font-size:13px;margin-bottom:14px;font-weight:600}
.clue{background:rgba(0,0,0,.28);border-radius:8px;padding:11px 12px;margin:8px 0;line-height:1.4;border-left:4px solid var(--ac)}
.sub,.note{color:var(--mu);font-size:13px;text-align:center;margin:6px 0 12px;line-height:1.45}
.vlist{display:grid;gap:8px}.vlist button{display:flex;align-items:center;gap:12px;text-align:left}
.bar{height:10px;border-radius:9px;background:var(--ac2);margin-top:5px;min-width:4px}
.res{text-align:center}.res .w{font:900 22px var(--disp);margin-bottom:8px}.ok{color:#3fe0a0}.bad{color:var(--ac2)}
.oddbox{background:var(--hero);border:1px solid var(--bd);color:#fff;border-radius:12px;padding:14px;margin:6px 0 16px}.oddbox small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.9}.oddbox b{display:block;font:900 30px var(--disp);margin-top:4px;word-break:break-word}
.code{font:900 34px var(--disp);letter-spacing:.25em;text-align:center;color:var(--ac);padding:10px 0;text-shadow:0 0 22px color-mix(in srgb,var(--ac) 45%,transparent)}
.pl{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.chat{height:280px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.msg{margin:5px 0;font-size:14px;line-height:1.4;word-break:break-word}.msg b{color:var(--ac2)}
.blurme{filter:blur(9px);-webkit-filter:blur(9px);user-select:none}
.tag{background:var(--ac2);color:var(--btn2-tx);border-radius:99px;font-size:11px;padding:2px 8px;font-weight:800}
.odd-badge{text-align:center;border:2px solid #ff5d8f!important;background:rgba(255,93,143,.14)!important;color:#ffd2e0}
.mode-intro{padding:14px;border-radius:14px;background:rgba(139,108,255,.18);border:1px solid var(--bd);font-weight:700;line-height:1.5;margin:4px 0 14px}
.mode-summary{border:1px solid var(--bd)}.mode-summary-line{padding:8px 10px;margin:5px 0;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;font-weight:700}
.mafia-role-card,.mafia-result-card{text-align:center;padding:24px 18px}
.mafia-role-badge{display:inline-flex;padding:9px 22px;border-radius:4px;font-size:14px;font-weight:900;letter-spacing:.16em;margin:0 auto 14px}
.mafia-red{background:#3a1119!important;color:#ffb3bf!important;border:1px solid #7a2a3a!important}.mafia-green{background:#0f2f22!important;color:#8ff0b8!important;border:1px solid #25664a!important}.mafia-human{background:#1b2850!important;color:#bcd0ff!important;border:1px solid #36508f!important}
.mafia-role-icon{font-size:64px;line-height:1.2;margin:8px auto}.mafia-role-title{font:900 clamp(30px,8vw,42px)/1.12 var(--disp);margin:8px 0 10px}
.mafia-role-desc{font-size:16px;line-height:1.5;font-weight:600;margin:0 auto 16px;max-width:330px}
.mafia-night-pill{display:inline-block;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;margin:4px auto 12px}
.mafia-result-kicker{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--mu)}.mafia-result-main{font-size:58px;line-height:1.2;margin:12px 0 4px}
.mafia-result-title{font:900 clamp(24px,7vw,34px)/1.15 var(--disp);margin:4px 0 12px;overflow-wrap:anywhere}
.mafia-result-message{font-size:18px;font-weight:800;line-height:1.4;padding:14px 12px;border-radius:10px;background:rgba(0,0,0,.3);margin:14px 0 20px}
.mafia-red-text{color:#ff6b81}.mafia-green-text{color:#4fe39a}
.mafia-reveal-chip{display:inline-block;padding:10px 13px;border-radius:8px;font-size:14px;font-weight:900;margin:8px auto}
.mafia-roles-heading{text-align:left;font-size:14px;font-weight:900;margin:20px 0 10px}
.mafia-player-result{display:flex;align-items:center;gap:9px;text-align:left;padding:12px 11px;border-radius:10px;margin:8px 0;font-weight:700}
.mafia-player-status{font-size:17px;flex:none}.mafia-player-name{flex:1;min-width:0;overflow-wrap:anywhere;color:inherit;font-size:15px}.mafia-player-role{font-size:12px;font-weight:900;text-align:right;max-width:48%;overflow-wrap:anywhere}
.mafia-tally-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px;font-weight:700}.mafia-tally-count{white-space:nowrap;color:var(--ac2);font-size:14px}
.mafia-night-alert{padding:16px 13px;border-radius:10px;text-align:center;font-size:19px;font-weight:900;line-height:1.35;margin:10px 0 16px;border:2px solid var(--bd)}
.mafia-night-kill{background:#3a1119;color:#ffb3bf;border-color:#a3263c}.mafia-night-save{background:#0f2f22;color:#8ff0b8;border-color:#25664a}.mafia-night-none{background:rgba(0,0,0,.3);color:var(--tx)}
.nh-secret-card{text-align:center;background:linear-gradient(145deg,rgba(139,108,255,.25),rgba(47,230,214,.12))!important}
.nh-secret{font:900 clamp(26px,8vw,38px) var(--disp);margin:12px 0;overflow-wrap:anywhere;color:#fff;text-shadow:0 0 24px rgba(139,108,255,.8)}
.nh-chat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.nh-chat-col{min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px}
.nh-col-title{font-size:11px;font-weight:900;letter-spacing:.06em;line-height:1.3;min-height:34px;color:var(--ac2);margin-bottom:7px}
.nh-feed{height:270px;padding:8px}.nh-chat-col input{font-size:12px;padding:10px 7px}.nh-chat-col button{font-size:12px;padding:9px 5px}
.nh-award-card{border-color:rgba(47,230,214,.5)!important}.nh-player-btn{margin:5px 0;text-align:left}
.nh-result-card{text-align:center;padding:28px 16px;background:linear-gradient(145deg,#30215f,#0f4a5c)!important}.nh-result-icon{font-size:58px}.nh-result-title{font:900 28px var(--disp);margin:8px}.nh-result-winner{font-size:21px;font-weight:900;color:#53f0d3;margin:12px 0}
.score-overlay{position:fixed;inset:0;background:rgba(3,6,14,.82);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
.score-modal{width:min(100%,420px);max-height:min(82vh,680px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:19px;box-shadow:0 25px 80px rgba(0,0,0,.6)}
.score-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.score-title{font:900 22px var(--disp)}.score-sub{font-size:12px;color:var(--mu);margin:4px 0 16px}
.score-row{display:flex;align-items:center;gap:11px;padding:11px 10px;margin:7px 0;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.04)}
.score-rank{width:29px;height:29px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px;font-weight:900}
.score-name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}.score-points{font-size:15px;font-weight:900;color:var(--ac2);white-space:nowrap}.score-empty{padding:18px 10px;text-align:center;color:var(--mu);font-size:13px}
button.score-close{width:36px;height:36px;padding:0;border-radius:10px;background:rgba(255,255,255,.1);color:var(--tx);box-shadow:none}
@media(max-width:360px){.game-brand{font-size:12px}.top-icon.score-trigger{padding:0 9px}.score-modal{padding:15px}.nh-chat-grid{grid-template-columns:1fr}.nh-feed{height:190px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Live voice chat controls — additive, kept outside the game layout */
#voice-dock{position:fixed;z-index:9998;left:0;right:0;bottom:0;width:100%;max-height:min(36vh,300px);display:none;flex-direction:column;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-bottom:0;border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 12px 38px #0007;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
#voice-dock.voice-visible{display:flex}
.voice-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.voice-title{font-size:13px;font-weight:900;letter-spacing:.04em}
.voice-mic{width:auto;min-width:116px;padding:10px 13px;border-radius:12px;font-size:13px}
.voice-mic.off{background:var(--btn2);color:var(--btn2-tx)}
.voice-status{font-size:11px;color:var(--mu);margin:0}
.voice-people{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;gap:5px;max-height:190px}
.voice-person{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:11px;background:var(--bg);font-size:12px}
.voice-person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-mute{width:auto;padding:7px 10px;border-radius:9px;font-size:11px;flex:none}
.voice-mute.muted{background:var(--btn2);color:var(--btn2-tx)}.voice-live{color:#55e6a5;font-weight:900}.avatar-picker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:8px 0 14px}.avatar-choice{padding:7px 2px;font-size:23px;background:rgba(255,255,255,.06);border:1px solid var(--bd);box-shadow:none;border-radius:11px}.avatar-choice.selected{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}.profile-preview{font-size:32px;vertical-align:middle;margin-right:8px}.voice-person .voice-state{font-size:10px;color:var(--mu);margin-left:auto;margin-right:5px}.dead-quick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.dead-quick button{font-size:12px;padding:10px 7px;background:rgba(214,38,74,.16);border:1px solid #8e2943;color:#ffd6df;box-shadow:none}.host-menu button.alt-menu{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--bd)}.translated-line{display:block;color:#75e6d2;font-size:12px;margin-top:2px}
@media(max-width:520px){#voice-dock{left:0;right:0;bottom:0;width:100%;max-height:36vh;border-radius:15px 15px 0 0}}


/* V2 lobby readiness, reactions and Name Hunt hints */
.lobby-ready-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;padding:8px;border-radius:12px;background:var(--bg)}
.lobby-ready-row .ready-state{margin-left:auto;font-size:11px;font-weight:900}
.ready-state.yes{color:#55e6a5}.ready-state.no{color:#ffbd69}
.lobby-ready-actions{display:flex;gap:6px;margin-left:auto}.lobby-ready-actions button{width:auto;padding:7px 9px;font-size:11px}
.reaction-bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.reaction-bar button{width:auto;min-width:42px;padding:9px;background:var(--btn2);color:var(--tx);box-shadow:none}
.reaction-toast{position:fixed;z-index:9997;left:50%;bottom:calc(38vh + 12px);transform:translateX(-50%);padding:10px 16px;border-radius:24px;background:#171c2a;color:#fff;box-shadow:0 8px 28px #0008;font-weight:900;pointer-events:none;animation:reactionPop 2.2s ease forwards}
@keyframes reactionPop{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}15%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px) scale(.95)}}
.hint-box{border:1px solid var(--ac);border-radius:12px;padding:10px;margin:8px 0;background:color-mix(in srgb,var(--ac) 10%,transparent)}
.hint-box button{margin-top:8px}

 // ---------- Cloud bridge: connects the existing PeerJS game to Supabase/Socket.IO backend ----------
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const cloud={active:null,created:null,lastStr:'',lastAt:0,pending:null,timer:null,wasConnected:false,profile:null,pendingRequests:0};
 async function whenConnected(ms){const t0=Date.now();while(Date.now()-t0<ms){if(socket&&socket.connected&&window.oddOneOutBackend&&window.oddOneOutBackend.createCloudRoom)return true;await wait(500)}return false}
 function normSnap(r){const s=r&&(r.snapshot||(r.room&&r.room.snapshot)||r.state);if(!s)return null;if(s.state&&typeof s.state==='object')return s;if(s.players)return{code:r.code||(r.room&&r.room.code)||s.code,state:s,cfg:s.cfg||{},at:Date.now()};return null}
 function flushSave(){
   cloud.timer=null;const snap=cloud.pending;if(!snap||!cloud.created||!socket||!socket.connected)return;cloud.pending=null;
   cloud.lastAt=Date.now();
   window.oddOneOutBackend.saveCloudRoom(cloud.created,snap).catch(e=>console.warn('[Odd One Out] Cloud save failed:',e.message));
 }
 window.oooCloud={
   hostStart(roomCode,snap){
     cloud.active=roomCode;cloud.created=null;cloud.lastStr='';cloud.pending=null;
     return (async()=>{
       if(!(await whenConnected(90000))||cloud.active!==roomCode)return false;
       const B=window.oddOneOutBackend;
       try{await B.createCloudRoom(roomCode,snap,false)}
       catch(e){try{await B.saveCloudRoom(roomCode,snap)}catch(e2){console.warn('[Odd One Out] Cloud room not created:',e2.message);return false}}
       if(cloud.active!==roomCode)return false;
       cloud.created=roomCode;cloud.lastStr=JSON.stringify([snap.state,snap.cfg]);cloud.lastAt=Date.now();
       return true;
     })();
   },
   save(roomCode,snap){
     if(cloud.created!==roomCode||!snap)return;
     const str=JSON.stringify([snap.state,snap.cfg]);if(str===cloud.lastStr)return;
     cloud.lastStr=str;cloud.pending=snap;
     if(cloud.timer)return;
     const delay=Math.max(0,5000-(Date.now()-cloud.lastAt));
     cloud.timer=setTimeout(flushSave,delay);
   },
   join(roomCode){
     cloud.active=roomCode;
     return (async()=>{
       if(!(await whenConnected(60000)))return false;
       try{await window.oddOneOutBackend.joinCloudRoom(roomCode);return true}
       catch(e){console.warn('[Odd One Out] Cloud join skipped:',e.message);return false}
     })();
   },
   async recover(roomCode){
     if(!(await whenConnected(15000)))return null;
     try{const r=await window.oddOneOutBackend.joinCloudRoom(roomCode);cloud.active=roomCode;return normSnap(r)}
     catch(e){return null}
   }
 };
 window.addEventListener('ooo-backend-status',ev=>{
   if(ev.detail&&ev.detail.connected){
     // After a reconnect the server forgets our socket room membership: re-subscribe.
     if(cloud.wasConnected&&cloud.active){window.oddOneOutBackend.joinCloudRoom(cloud.active).catch(()=>{})}
     cloud.wasConnected=true;
   }
 });
 window.addEventListener('ooo-backend-auth-ready',ev=>{cloud.profile=(ev.detail&&ev.detail.profile)||null;cloud.userId=(ev.detail&&ev.detail.user&&ev.detail.user.id)||(cloud.profile&&cloud.profile.id)||null;mountFriendsButton()});

 // ---------- Friends + invites UI ----------
 const css=document.createElement('style');
 css.textContent='#ooo-friends-btn{position:fixed;z-index:900;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:auto;padding:11px 15px;border-radius:999px;font-size:14px}body:has(#voice-dock.voice-visible) #ooo-friends-btn{bottom:calc(min(36vh,300px) + 14px)}#ooo-friends-btn i{font-style:normal;background:#e63a5c;color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;font-size:12px}.ooo-row{display:flex;align-items:center;gap:8px;margin:8px 0}.ooo-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.ooo-row button{width:auto;padding:8px 11px;font-size:12px}.ooo-dot{width:9px;height:9px;border-radius:50%;background:#6b7c83;flex:none}.ooo-dot.on{background:#55e6a5}.ooo-toast{position:fixed;z-index:1100;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:92vw;padding:10px 16px;border-radius:14px;background:#171c2a;color:#fff;font-weight:800;box-shadow:0 8px 28px #0008}.ooo-sec{margin:14px 0 4px;color:var(--mu);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}';
 document.head.appendChild(css);
 const mk=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
 function toast(text){const t=mk('div','ooo-toast',text);document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
 const presence=new Map(), names={};
 const label=u=>u?(u.username?'@'+u.username:(u.display_name||'Player')):'Player';
 // Accepts the new server shape ({friends,incoming,outgoing}) and the old one (one mixed friendships array).
 function splitFriends(d){
   if(d&&Array.isArray(d.incoming))return{friends:d.friends||[],incoming:d.incoming,outgoing:d.outgoing||[]};
   const out={friends:[],incoming:[],outgoing:[]};
   (d&&Array.isArray(d.friends)?d.friends:[]).forEach(r=>{
     const mine=r.requester_id===cloud.userId,o=(mine?r.addressee:r.requester)||{};
     const v={id:r.id,status:r.status,user:{id:mine?r.addressee_id:r.requester_id,username:o.username,display_name:o.display_name}};
     if(r.status==='accepted')out.friends.push(v);else if(r.status==='pending')(mine?out.outgoing:out.incoming).push(v);
   });
   return out;
 }
 let friendsOpen=false,friendsMsg='';
 function mountFriendsButton(){
   if(document.getElementById('ooo-friends-btn'))return;
   const b=mk('button','','👥 Friends');b.id='ooo-friends-btn';b.onclick=()=>{friendsOpen=true;friendsMsg='';renderFriends()};document.body.appendChild(b);
   updateBadge();
   if(cloud.profile&&!cloud.profile.username)toast('Set a username in 👥 Friends so friends can find you');
   window.oddOneOutBackend.friends().then(d=>{cloud.pendingRequests=splitFriends(d).incoming.length;updateBadge()}).catch(()=>{});
 }
 function updateBadge(){const b=document.getElementById('ooo-friends-btn');if(!b)return;b.textContent='👥 Friends';if(cloud.pendingRequests>0){b.appendChild(mk('i','',String(cloud.pendingRequests)))}}
 async function renderFriends(){
   const old=document.querySelector('.ooo-friends-overlay');if(old)old.remove();if(!friendsOpen)return;
   const ov=mk('div','score-overlay ooo-friends-overlay');ov.onclick=e=>{if(e.target===ov){friendsOpen=false;ov.remove()}};
   const modal=mk('div','score-modal'),head=mk('div','score-head');head.append(mk('div','score-title','👥 Friends'));
   const close=mk('button','score-close','✕');close.onclick=()=>{friendsOpen=false;ov.remove()};head.append(close);modal.append(head);
   const B=window.oddOneOutBackend;
   if(cloud.profile&&cloud.profile.username){modal.append(mk('p','score-sub','Your username: @'+cloud.profile.username))}
   else{
     modal.append(mk('div','ooo-sec','Choose your username'));
     const r0=mk('div','two'),u0=mk('input');u0.placeholder='letters, numbers, _';u0.maxLength=20;u0.autocapitalize='none';const sv=mk('button','','Save');
     sv.onclick=async()=>{const v=u0.value.trim();if(!v)return;sv.disabled=true;try{const r=await B.api('/api/username',{method:'POST',body:JSON.stringify({username:v})});cloud.profile=r.profile;friendsMsg='Username saved: @'+r.profile.username}catch(e){friendsMsg=e.message}renderFriends()};
     r0.append(u0,sv);modal.append(r0);
   }
   modal.append(mk('div','ooo-sec','Add a friend'));
   const add=mk('div','two'),inp=mk('input');inp.placeholder='Friend username';inp.maxLength=32;inp.autocapitalize='none';const send=mk('button','alt','Add');
   send.onclick=async()=>{const u=inp.value.trim();if(!u)return;send.disabled=true;try{await B.requestFriend(u);friendsMsg='Request sent to '+u;inp.value=''}catch(e){friendsMsg=e.message}renderFriends()};
   add.append(inp,send);modal.append(add);
   if(friendsMsg)modal.append(mk('p','note',friendsMsg));
   const body=mk('div');modal.append(body);ov.append(modal);document.body.appendChild(ov);
   body.append(mk('p','note','Loading...'));
   try{
     const {friends,incoming,outgoing}=splitFriends(await B.friends());
     if(!friendsOpen)return;body.replaceChildren();
     [...friends,...incoming,...outgoing].forEach(f=>{if(f.user&&f.user.id)names[f.user.id]=label(f.user)});
     cloud.pendingRequests=incoming.length;updateBadge();
     if(incoming.length){body.append(mk('div','ooo-sec','Requests'));incoming.forEach(r=>{
       const row=mk('div','ooo-row');row.append(mk('span','nm',label(r.user)));
       const ok=mk('button','','Accept'),no=mk('button','alt','Decline');
       const answer=async yes=>{ok.disabled=no.disabled=true;try{await B.respondFriend(r.id,yes);friendsMsg=yes?'Friend added':'Request declined'}catch(e){friendsMsg=e.message}renderFriends()};
       ok.onclick=()=>answer(true);no.onclick=()=>answer(false);row.append(ok,no);body.append(row)})}
     body.append(mk('div','ooo-sec','Friends'));
     if(!friends.length)body.append(mk('p','note','No friends yet. Add someone by username.'));
     friends.forEach(f=>{
       const isOn=presence.has(f.user.id)?presence.get(f.user.id):!!f.online;
       const row=mk('div','ooo-row'),dot=mk('span','ooo-dot'+(isOn?' on':''));
       row.append(dot,mk('span','nm',label(f.user)));
       const inv=mk('button','alt','Invite');
       inv.onclick=async()=>{
         if(!code||ph==='join'){friendsMsg='Create or join a room first, then invite.';return renderFriends()}
         inv.disabled=true;try{await B.inviteFriend(f.user.id,code);friendsMsg='Invite sent to '+label(f.user)}catch(e){friendsMsg=e.message}renderFriends()};
       row.append(inv);body.append(row)});
     if(outgoing.length){body.append(mk('div','ooo-sec','Sent requests'));outgoing.forEach(r=>{const row=mk('div','ooo-row');row.append(mk('span','nm',label(r.user)),mk('span','note','Pending'));body.append(row)})}
   }catch(e){body.replaceChildren(mk('p','note',e.message))}
 }
 window.addEventListener('ooo-friend-request',()=>{cloud.pendingRequests++;updateBadge();toast('👥 New friend request');if(friendsOpen)renderFriends()});
 window.addEventListener('ooo-presence-changed',ev=>{const d=ev.detail||{};if(d.userId)presence.set(d.userId,!!d.online);if(friendsOpen)renderFriends()});
 window.addEventListener('ooo-friend-invite',async ev=>{
   const d=ev.detail||{},rc=String(d.roomCode||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!rc)return;
   if(d.from&&!names[d.from]){try{const s=splitFriends(await window.oddOneOutBackend.friends());s.friends.forEach(f=>{names[f.user.id]=label(f.user)})}catch(e){}}
   const who=names[d.from]||'A friend',inRoom=typeof ph!=='undefined'&&ph!=='join';
   if(!confirm(who+' invited you to room '+rc.toUpperCase()+'. Join?'+(inRoom?' You will leave your current room.':'')))return;
   inCode=rc;
   if(!me.name.trim()){msg='Pehle apna naam likho';ph='join';return render()}
   saveProfile();connecting=true;ph='join';render();joinRoom(rc);
 });

 async function start(){
   try{
     await Promise.all([
       load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'),
       load('https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js')
     ]);
     if(!window.supabase?.createClient)throw new Error('Supabase client library did not load.');
     supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
     window.oddOneOutBackend={client:supabaseClient,socket:null,getSession:()=>session,api,
       friends:()=>api('/api/friends'),
       requestFriend:username=>api('/api/friends/request',{method:'POST',body:JSON.stringify({username})}),
       respondFriend:(requestId,accept)=>api('/api/friends/respond',{method:'POST',body:JSON.stringify({requestId,accept})}),
       inviteFriend:(friendId,roomCode)=>new Promise((resolve,reject)=>{if(!socket?.connected)return reject(new Error('Backend socket is not connected.'));socket.emit('friend:invite',{friendId,roomCode},r=>r?.ok?resolve(r):reject(new Error(r?.error||'Invite failed.')))}),
       createCloudRoom:(code,snapshot,isPrivate=false)=>new Promise((resolve,reject)=>{if(!socket?.connected)return reject(new Error('Backend socket is not connected.'));socket.emit('room:create',{code,snapshot,isPrivate},r=>r?.ok?resolve(r):reject(new Error(r?.error||'Room creation failed.')))}),
       joinCloudRoom:code=>new Promise((resolve,reject)=>{if(!socket?.connected)return reject(new Error('Backend socket is not connected.'));socket.emit('room:join',{code},r=>r?.ok?resolve(r):reject(new Error(r?.error||'Room join failed.')))}),
       saveCloudRoom:(code,snapshot)=>new Promise((resolve,reject)=>{if(!socket?.connected)return reject(new Error('Backend socket is not connected.'));socket.emit('room:save',{code,snapshot},r=>r?.ok?resolve(r):reject(new Error(r?.error||'Room save failed.')))})
     };
     const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;
     session=data.session;
     if(!session){
       const guest=await supabaseClient.auth.signInAnonymously();
       if(guest.error)throw guest.error;
       session=guest.data.session;
     }
     if(!session?.access_token)throw new Error('Supabase did not return an access token.');
     const me=await api('/api/me');
     console.info('[Odd One Out] Guest authentication ready:',me.profile?.display_name||'Guest');
     connectSocket();
     supabaseClient.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(session?.access_token)connectSocket();else if(socket){socket.disconnect();socket=null}});
     window.dispatchEvent(new CustomEvent('ooo-backend-auth-ready',{detail:{user:me.user,profile:me.profile}}));
   }catch(err){
     console.error('[Odd One Out] Backend setup failed:',err.message);
     window.dispatchEvent(new CustomEvent('ooo-backend-error',{detail:{message:err.message}}));
   }
 }
 window.addEventListener('online',()=>{if(session?.access_token&&!socket?.connected)connectSocket()});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script></body></html>
